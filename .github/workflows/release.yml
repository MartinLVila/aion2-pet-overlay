name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check the tag matches version.py
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = python -c "from version import __version__; print(__version__)"
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME doesn't match version.py ($version)" }

      - name: Build and test the exe
        shell: pwsh
        run: ./build.ps1

      - uses: actions/upload-artifact@v5
        with:
          name: Aion2PetOverlay
          path: |
            dist/Aion2PetOverlay.exe
            dist/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            dist/Aion2PetOverlay.exe dist/SHA256SUMS.txt `
            --title "Aion 2 Pet Overlay $env:GITHUB_REF_NAME" `
            --notes-file .github/release-notes.md
